# Unit tests (DataSakshi D103). They run on GitHub before anything is deployed
# to Databricks: by the agent, by the push guard, and as the first step of CI.
# Only tests/ is collected. The root-level test_transforms_07_*.py is a
# failure-lab scenario (its function has a deliberate bug) and stays outside.
[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    spark: DataFrame logic on a local SparkSession (level 2); no Databricks
