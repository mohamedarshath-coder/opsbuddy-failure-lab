bundle:
  name: opsbuddy-failure-lab-pipeline

# Same cluster the pipeline already runs on manually -- reused here rather than a job_cluster
# spec, so this bundle doesn't spin up a separate cluster in addition to the existing one.
variables:
  cluster_id:
    default: "0617-093607-afaabl4i"
  target_schema:
    description: >-
      Which schema Job A/Job B read and write. qa target overrides this to "qa" (created
      specifically for CI so these runs never touch the same tables a real/manual run would);
      prod target keeps the existing "default" schema unchanged.
    default: "default"
  bronze_target_schema:
    description: >-
      Which catalog.schema reads/writes for any job using the "dev.opsbuddy_test" demo
      convention (bronze_product_catalog's raw_product_feed/bronze_active_products,
      customer_balance_merge_duplicate's customer_balances) -- distinct from target_schema
      because these jobs use a fully-qualified catalog.schema, not a bare schema name under an
      implicit catalog like the pipeline jobs use. qa target overrides this to
      "dev.opsbuddy_test_qa" so CI runs never touch the real dev.opsbuddy_test tables. Shared
      across these jobs deliberately, not one variable per job -- they all genuinely use the
      same demo catalog/schema convention.
    default: "dev.opsbuddy_test"

resources:
  jobs:
    daily_txn_ingestion:
      name: "daily_txn_ingestion_${bundle.target}"
      tasks:
        - task_key: ingest_raw_transactions
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./pipeline/00_ingest_raw_transactions.py
            base_parameters:
              target_schema: ${var.target_schema}

    vip_risk_threshold_flagging:
      name: "vip_risk_threshold_flagging_${bundle.target}"
      tasks:
        - task_key: flag_high_risk_accounts
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/11_shared_module_bug_vip_risk_threshold.py
            base_parameters:
              target_schema: ${var.target_schema}

    bronze_product_catalog:
      name: "bronze_product_catalog_${bundle.target}"
      tasks:
        - task_key: build_bronze_product_catalog
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./07_bronze_product_catalog.py
            base_parameters:
              target_schema: ${var.bronze_target_schema}

    customer_balance_merge_duplicate:
      name: "customer_balance_merge_duplicate_${bundle.target}"
      tasks:
        - task_key: upsert_customer_balances
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/13_delta_merge_duplicate_match.py
            base_parameters:
              target_schema: ${var.bronze_target_schema}

    daily_revenue_reconciliation:
      name: "daily_revenue_reconciliation_${bundle.target}"
      tasks:
        - task_key: extract_daily_transactions
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./pipeline/01_extract_daily_transactions.py
            base_parameters:
              target_schema: ${var.target_schema}
        - task_key: validate_and_clean_transactions
          depends_on:
            - task_key: extract_daily_transactions
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./pipeline/02_validate_and_clean_transactions.py
            base_parameters:
              target_schema: ${var.target_schema}
        - task_key: reconcile_with_ledger
          depends_on:
            - task_key: validate_and_clean_transactions
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./pipeline/03_reconcile_with_ledger.py
            base_parameters:
              target_schema: ${var.target_schema}
        - task_key: publish_summary
          depends_on:
            - task_key: reconcile_with_ledger
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./pipeline/04_publish_summary.py
            base_parameters:
              target_schema: ${var.target_schema}

targets:
  qa:
    mode: development
    variables:
      target_schema: "qa"
      bronze_target_schema: "dev.opsbuddy_test_qa"
    workspace:
      host: https://adb-3750626659891863.3.azuredatabricks.net
      root_path: /Workspace/Users/mohamed.arshath@latentviewo365.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    variables:
      target_schema: "default"
      bronze_target_schema: "dev.opsbuddy_test"
    workspace:
      host: https://adb-3750626659891863.3.azuredatabricks.net
      # required for any target with mode: production, so exactly one copy of the bundle is
      # ever deployed regardless of which CI runner/user account triggers the deploy step.
      root_path: /Workspace/Users/mohamed.arshath@latentviewo365.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
