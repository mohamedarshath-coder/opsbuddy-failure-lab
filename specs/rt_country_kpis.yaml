# DataSakshi check spec (read from main; a branch may add checks but never
# remove or loosen these). Retail orders demo, mart.
table: dev.opsbuddy_test.rt_country_kpis
version: 1
checks:
  - id: one_row_per_country
    type: uniqueness
    columns: [customer_country]
    phases: [branch, uat, postprod]
  - id: not_empty
    type: row_count
    min: 1
    phases: [branch, uat, postprod]
required: [one_row_per_country, not_empty]
