# DataSakshi check spec (read from main; a branch may add checks but never
# remove or loosen these). Subscription billing demo, gold.
table: dev.opsbuddy_test.bl_mrr_monthly
version: 1
checks:
  - id: expected_schema
    type: schema
    columns:
      - {name: month, type: date}
      - {name: account_country, type: string}
      - {name: plan_tier, type: string}
      - {name: active_subscriptions, type: bigint}
      - {name: mrr_usd, type: "decimal(14,2)"}
    allow_extra_columns: true
    phases: [branch, uat, postprod]
  - id: one_row_per_month_country_tier
    type: uniqueness
    columns: [month, account_country, plan_tier]
    phases: [branch, uat, postprod]
  - id: mrr_not_negative
    type: range
    column: mrr_usd
    min: 0
    phases: [branch, uat, postprod]
required: [one_row_per_month_country_tier, mrr_not_negative]
