name: Databricks pipeline CI/CD

# Single-file, sequential pattern: one job per event type instead of two files chained by
# workflow_run. test-qa reacts to pull_request (validates against the qa schema, never touches
# prod data); deploy-prod reacts to push on main (only reachable via a human-approved merge).
# The gate between them isn't a `needs:`/`workflow_run` dependency -- it's GitHub's branch
# protection on main requiring the "test-qa" check to pass before a merge is even allowed, so a
# push to main is only ever created by a PR that already passed test-qa.
#
# test-qa runs ONLY the bundle jobs a PR actually affects (see .github/scripts/select_qa_jobs.py)
# -- not every job in the bundle unconditionally. Confirmed live as a real, necessary fix: an
# earlier version ran every bundle job on every PR touching pipeline/**/notebooks/**, which meant
# a PR fixing notebooks/14_malformed_numeric_udf_crash.py (not itself in the bundle at all) still
# failed test-qa, because it re-ran vip_risk_threshold_flagging -- a different, already-broken
# job in the bundle -- and reported that unrelated failure as if it were about this PR's change.
# select_qa_jobs.py fixes this with real dependency awareness (exact notebook match, plus a
# specific rule for shared "common/" modules), not just "run everything" or "run nothing based on
# top-level directory" (an intermediate version of that script was tested and confirmed wrong
# before this one shipped -- see the script's own docstring for why).
on:
  pull_request:
    paths:
      - "pipeline/**"
      - "notebooks/**"
      - "databricks.yml"
      - ".github/workflows/deploy_pipeline.yml"
      - ".github/scripts/select_qa_jobs.py"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "notebooks/**"
      - "databricks.yml"
      - ".github/workflows/deploy_pipeline.yml"
      - ".github/scripts/select_qa_jobs.py"

jobs:
  test-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so `git diff base...head` in select_qa_jobs.py can actually
          # resolve both ends -- the default shallow checkout only fetches the merge commit.
          fetch-depth: 0
      - uses: databricks/setup-cli@main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Deploy bundle to qa target
        run: databricks bundle deploy -t qa
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Select which bundle jobs this PR actually affects
        id: select
        run: |
          set -euo pipefail
          jobs=$(python .github/scripts/select_qa_jobs.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Selected jobs:"
          echo "$jobs"
          # Multi-line output via the delimiter form -- a plain "jobs=$jobs" would break on
          # more than one selected job, since GITHUB_OUTPUT only supports single-line values
          # without this form.
          {
            echo "jobs<<QA_JOBS_EOF"
            echo "$jobs"
            echo "QA_JOBS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Run each affected bundle job against the qa schema
        if: steps.select.outputs.jobs != ''
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r job; do
            [ -z "$job" ] && continue
            echo "::group::Running $job against qa schema"
            if ! databricks bundle run "$job" -t qa; then
              echo "::error::$job failed against qa schema"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done <<< "${{ steps.select.outputs.jobs }}"
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures bundle job(s) failed against qa -- see grouped logs above"
            exit 1
          fi
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: No affected bundle jobs -- nothing to qa-test for this PR
        if: steps.select.outputs.jobs == ''
        run: echo "No bundle job depends on any file this PR changed -- test-qa passes trivially."

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to prod target
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
