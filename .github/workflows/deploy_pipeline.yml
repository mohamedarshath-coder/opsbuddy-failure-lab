name: Databricks pipeline CI/CD

# Single-file, sequential pattern: one job per event type instead of two files chained by
# workflow_run. lint -> test-qa react to pull_request (fast free lint first, then the heavier
# real-data-driven check against the qa schema, never touching prod data); deploy-prod reacts to
# push on main (only reachable via a human-approved merge). The gate before merge isn't a
# workflow_run chain -- it's GitHub's branch protection on main requiring "test-qa" to pass, so a
# push to main is only ever created by a PR that already passed both lint and test-qa (test-qa
# has needs: lint, so it never even starts if lint fails).
on:
  pull_request:
    paths:
      - "pipeline/**"
      - "databricks.yml"
      - ".github/workflows/deploy_pipeline.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "databricks.yml"
      - ".github/workflows/deploy_pipeline.yml"

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff black
      - name: ruff check pipeline/
        run: ruff check pipeline/
      - name: black --check pipeline/
        run: black --check pipeline/

  test-qa:
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to qa target
        run: databricks bundle deploy -t qa
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Run Job A (ingestion) against qa schema
        run: databricks bundle run daily_txn_ingestion -t qa
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Run Job B (reconciliation) against qa schema
        run: databricks bundle run daily_revenue_reconciliation -t qa
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to prod target
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
