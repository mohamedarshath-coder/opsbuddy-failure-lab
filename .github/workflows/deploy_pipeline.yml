name: Databricks pipeline CI/CD

# Single-file, sequential pattern: one job per event type instead of two files chained by
# workflow_run. test-qa reacts to pull_request (validates against the qa schema, never touches
# prod data); deploy-prod reacts to push on main (only reachable via a human-approved merge).
# The gate between them isn't a `needs:`/`workflow_run` dependency -- it's GitHub's branch
# protection on main requiring the "test-qa" check to pass before a merge is even allowed, so a
# push to main is only ever created by a PR that already passed test-qa.
#
# test-qa runs ONLY the bundle jobs a PR actually affects (see .github/scripts/select_qa_jobs.py)
# -- not every job in the bundle unconditionally. Confirmed live as a real, necessary fix: an
# earlier version ran every bundle job on every PR touching pipeline/**/notebooks/**, which meant
# a PR fixing notebooks/14_malformed_numeric_udf_crash.py (not itself in the bundle at all) still
# failed test-qa, because it re-ran vip_risk_threshold_flagging -- a different, already-broken
# job in the bundle -- and reported that unrelated failure as if it were about this PR's change.
# select_qa_jobs.py fixes this with real dependency awareness (exact notebook match, plus a
# specific rule for shared "common/" modules), not just "run everything" or "run nothing based on
# top-level directory" (an intermediate version of that script was tested and confirmed wrong
# before this one shipped -- see the script's own docstring for why).
on:
  pull_request:
    paths:
      - "pipeline/**"
      - "notebooks/**"
      - "databricks.yml"
      - ".github/workflows/deploy_pipeline.yml"
      - ".github/scripts/select_qa_jobs.py"
      # DataSakshi D103: anything the unit tests read or are made of. Without these a
      # PR changing only tests, root-level logic modules or specs never ran the tests.
      - "tests/**"
      - "pytest.ini"
      - "requirements-dev.txt"
      - "*.py"
      - "specs/**"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "notebooks/**"
      - "databricks.yml"
      - ".github/workflows/deploy_pipeline.yml"
      - ".github/scripts/select_qa_jobs.py"
      # DataSakshi D103: anything the unit tests read or are made of. Without these a
      # PR changing only tests, root-level logic modules or specs never ran the tests.
      - "tests/**"
      - "pytest.ini"
      - "requirements-dev.txt"
      - "*.py"
      - "specs/**"

jobs:
  test-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so `git diff base...head` in select_qa_jobs.py can actually
          # resolve both ends -- the default shallow checkout only fetches the merge commit.
          fetch-depth: 0
      - uses: databricks/setup-cli@main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      # DataSakshi D103: unit tests first, on this machine, before anything is deployed
      # to Databricks. Red here means no bundle deploy. CI=true: Spark tests cannot skip.
      - name: Set up Java for local Spark unit tests
        if: hashFiles('tests/**/*.py') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # DataSakshi D110: on every PR, a developer's too: no test may be deleted or
      # switched off (fails); logic without tests is shown as a warning. The guard
      # comes from main, so a PR cannot weaken the check that judges it.
      - name: Test integrity (no deleted or switched-off tests)
        if: hashFiles('tests/**/*.py') != ''
        run: |
          guard="$RUNNER_TEMP/unit_test_guard.py"
          git show origin/main:.github/scripts/unit_test_guard.py > "$guard" 2>/dev/null || true
          # Until main has the --ci mode, use this PR's copy once.
          grep -q -- "--ci" "$guard" || cp .github/scripts/unit_test_guard.py "$guard"
          mkdir -p "$RUNNER_TEMP/guard"
          OUT_DIR="$RUNNER_TEMP/guard" START_SHA="$(git rev-parse HEAD^1)" python "$guard" --ci
      - name: Unit tests (no Databricks)
        if: hashFiles('tests/**/*.py') != ''
        run: |
          pip install -r requirements-dev.txt
          python -m pytest
        env:
          CI: "true"
      - name: Deploy bundle to qa target
        run: databricks bundle deploy -t qa
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Select which bundle jobs this PR actually affects
        id: select
        run: |
          set -euo pipefail
          jobs=$(python .github/scripts/select_qa_jobs.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Selected jobs:"
          echo "$jobs"
          # Multi-line output via the delimiter form -- a plain "jobs=$jobs" would break on
          # more than one selected job, since GITHUB_OUTPUT only supports single-line values
          # without this form.
          {
            echo "jobs<<QA_JOBS_EOF"
            echo "$jobs"
            echo "QA_JOBS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Run each affected bundle job against the qa schema
        if: steps.select.outputs.jobs != ''
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r job; do
            [ -z "$job" ] && continue
            echo "::group::Running $job against qa schema"
            if ! databricks bundle run "$job" -t qa; then
              echo "::error::$job failed against qa schema"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done <<< "${{ steps.select.outputs.jobs }}"
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures bundle job(s) failed against qa -- see grouped logs above"
            exit 1
          fi
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: No affected bundle jobs -- nothing to qa-test for this PR
        if: steps.select.outputs.jobs == ''
        run: echo "No bundle job depends on any file this PR changed -- test-qa passes trivially."

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so select_qa_jobs.py can diff the previous main head against this push.
          fetch-depth: 0
      - uses: databricks/setup-cli@main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      # DataSakshi D103: unit tests first, on this machine, before anything is deployed
      # to Databricks. Red here means no bundle deploy. CI=true: Spark tests cannot skip.
      - name: Set up Java for local Spark unit tests
        if: hashFiles('tests/**/*.py') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests (no Databricks)
        if: hashFiles('tests/**/*.py') != ''
        run: |
          pip install -r requirements-dev.txt
          python -m pytest
        env:
          CI: "true"
      - name: Deploy bundle to prod target
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # Deploying only updates the job definitions. Running the jobs this push affected makes the
      # release's data change happen inside this run, so the run's start and end bound the release
      # (DataSakshi reads the Delta versions written during the production deploy run).
      - name: Select which bundle jobs this push affects
        id: select
        run: |
          set -euo pipefail
          jobs=$(python .github/scripts/select_qa_jobs.py \
            "${{ github.event.before }}" \
            "${{ github.sha }}")
          echo "Selected jobs:"
          echo "$jobs"
          {
            echo "jobs<<PROD_JOBS_EOF"
            echo "$jobs"
            echo "PROD_JOBS_EOF"
          } >> "$GITHUB_OUTPUT"
      # DataSakshi D93: copy the governed tables this release writes (deep clone) before the jobs change them, so a
      # rollback can restore it after Delta's 7-day file retention. A failed copy stops the deploy.
      - name: Copy governed tables before the jobs run
        if: steps.select.outputs.jobs != ''
        run: python .github/scripts/backup_tables.py
        env:
          DATABRICKS_HOST: https://adb-3750626659891863.3.azuredatabricks.net
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: f305478805c718a0
          BACKUP_SCHEMA: datasakshi_backups
          CATALOG_MAP: dev=dev
          MERGE_SHA: ${{ github.sha }}
          KEEP_DAYS: "30"
          # Copy only what this release's jobs write (falls back to every governed table).
          JOBS: ${{ steps.select.outputs.jobs }}
      - name: Run each affected bundle job on the prod target
        if: steps.select.outputs.jobs != ''
        run: |
          set -euo pipefail
          while IFS= read -r job; do
            [ -z "$job" ] && continue
            echo "::group::Running $job on prod"
            databricks bundle run "$job" -t prod
            echo "::endgroup::"
          done <<< "${{ steps.select.outputs.jobs }}"
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: No affected bundle jobs
        if: steps.select.outputs.jobs == ''
        run: echo "No bundle job depends on any file this push changed -- nothing to run on prod."
