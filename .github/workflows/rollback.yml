# Data rollback: restore one Delta table to an earlier version (TDD rollback
# runbook). Run by hand from the Actions tab, or by DataSakshi after a failed
# required post-prod check. Uses the deploy principal's token, never an agent's.
name: Rollback a table

on:
  workflow_dispatch:
    inputs:
      table:
        description: "Table to restore, catalog.schema.table"
        required: true
      version:
        description: "Delta version to restore to (from the DGR rollback plan)"
        required: true
      warehouse_id:
        description: "SQL warehouse that runs the RESTORE"
        required: true
      source:
        description: "Optional pre-deploy copy to restore from (DataSakshi D93); blank uses time travel"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: databricks/setup-cli@main
      - name: Restore the table
        env:
          DATABRICKS_HOST: https://adb-3750626659891863.3.azuredatabricks.net
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          TABLE: ${{ inputs.table }}
          VERSION: ${{ inputs.version }}
          WAREHOUSE: ${{ inputs.warehouse_id }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          # Inputs go into SQL, so accept only plain names and a number.
          [[ "$TABLE" =~ ^[A-Za-z0-9_]+\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+$ ]] || { echo "::error::bad table name"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::version must be a number"; exit 1; }
          [[ "$WAREHOUSE" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::bad warehouse id"; exit 1; }
          if [ -n "$SOURCE" ]; then
            # The copy has its own files: no time travel, no retention limit.
            [[ "$SOURCE" =~ ^[A-Za-z0-9_]+\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+$ ]] || { echo "::error::bad source name"; exit 1; }
            statement="CREATE OR REPLACE TABLE $TABLE DEEP CLONE $SOURCE"
          else
            statement="RESTORE TABLE $TABLE TO VERSION AS OF $VERSION"
          fi
          body=$(printf '{"warehouse_id":"%s","statement":"%s","wait_timeout":"50s"}' "$WAREHOUSE" "$statement")
          result=$(databricks api post /api/2.0/sql/statements --json "$body")
          state=$(echo "$result" | python3 -c "import json,sys; print(json.load(sys.stdin)['status']['state'])")
          id=$(echo "$result" | python3 -c "import json,sys; print(json.load(sys.stdin)['statement_id'])")
          # A large table takes longer than one wait: poll until it ends (up to 1 hour).
          for _ in $(seq 1 720); do
            case "$state" in PENDING|RUNNING) ;; *) break ;; esac
            sleep 5
            result=$(databricks api get "/api/2.0/sql/statements/$id")
            state=$(echo "$result" | python3 -c "import json,sys; print(json.load(sys.stdin)['status']['state'])")
          done
          echo "$result"
          [ "$state" = "SUCCEEDED" ] || { echo "::error::RESTORE ended in state $state"; exit 1; }
          echo "Restored $TABLE to version $VERSION${SOURCE:+ from $SOURCE}"
